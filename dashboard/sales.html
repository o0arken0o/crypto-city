// automatic first look only (NOT an audit): high APY, small deposits or APY made of rewards = more risk
function riskOf(p) {
  const apy = +p.apy || 0, tvl = +p.tvl_musd || 0, rew = +p.reward || 0;
  if (apy > 12 || tvl < 75 || rew > apy / 2) return ["#ff4d6a", "alto"];
  if (apy > 8 || tvl < 200 || rew > 0) return ["#ffb020", "medio"];
