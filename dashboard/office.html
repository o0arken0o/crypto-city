function earthTexture() {
  const W = 2048, Hh = 1024, X = lon => (lon + 180) / 360 * W, Y = lat => (90 - lat) / 180 * Hh;
  const mask = document.createElement("canvas"); mask.width = W; mask.height = Hh; const m = mask.getContext("2d");
  m.fillStyle = "#fff"; for (const poly of LAND) { m.beginPath(); poly.forEach(([lo, la], i) => i ? m.lineTo(X(lo), Y(la)) : m.moveTo(X(lo), Y(la))); m.closePath(); m.fill(); }
  const land = m.getImageData(0, 0, W, Hh).data;
  return canvasTex(W, Hh, g => {
    g.fillStyle = "#04102a"; g.fillRect(0, 0, W, Hh);
    g.strokeStyle = "rgba(79,170,255,.3)"; g.lineWidth = 2;
    for (let lo = -180; lo <= 180; lo += 30) { g.beginPath(); g.moveTo(X(lo), 0); g.lineTo(X(lo), Hh); g.stroke(); }
    for (let la = -60; la <= 60; la += 30) { g.beginPath(); g.moveTo(0, Y(la)); g.lineTo(W, Y(la)); g.stroke(); }
    const step = 9;
    for (let y = step / 2; y < Hh; y += step) {
      const k = Math.max(.25, Math.cos((90 - y / Hh * 180) * Math.PI / 180));
      for (let x = step / 2; x < W; x += step / k) {
        if (!land[(Math.floor(y) * W + Math.floor(x)) * 4]) continue;
        g.fillStyle = (x * 7 + y * 3) % 13 < 1 ? "#ffffff" : "#5ab4ff"; g.fillRect(x - 2.4, y - 2.4 * k, 4.8, 4.8 * k);
      }
    }
  });
}

// ---------------------------------------------------------------- the track: Idea → Backtest → Paper trading → Live
// A raised rounded loop around the globe. Corners: D (left on screen) = Idea, C (front) between Backtest and Paper,
// B (right) = Live. Strategies sit on it as glowing data blocks in their stage.
const TW = 17, TD = 11, TR = 2.6, TY = .32, TCX = 0, TCZ = 0;
function loopPoints(w, d, r, n = 240) {
  const s = new THREE.Shape(); const x = -w / 2, z = -d / 2;
  s.moveTo(x + r, z); s.lineTo(x + w - r, z); s.quadraticCurveTo(x + w, z, x + w, z + r); s.lineTo(x + w, z + d - r); s.quadraticCurveTo(x + w, z + d, x + w - r, z + d);
  s.lineTo(x + r, z + d); s.quadraticCurveTo(x, z + d, x, z + d - r); s.lineTo(x, z + r); s.quadraticCurveTo(x, z, x + r, z);
  return s.getSpacedPoints(n).map(p => new THREE.Vector3(p.x + TCX, 0, p.y + TCZ));
}
{
  const outer = new THREE.Shape(loopPoints(TW + 1.6, TD + 1.6, TR + .8, 200).map(p => new THREE.Vector2(p.x, p.z)));
  outer.holes.push(new THREE.Path(loopPoints(TW - 1.6, TD - 1.6, TR - .8, 200).map(p => new THREE.Vector2(p.x, p.z)).reverse()));
  const deck = new THREE.Mesh(new THREE.ExtrudeGeometry(outer, { depth: TY, bevelEnabled: false }), new THREE.MeshStandardMaterial({ color: 0x08132c, metalness: .7, roughness: .3 }));
  deck.rotation.x = Math.PI / 2; deck.position.y = TY; scene.add(deck);
  for (const [w, d, r, rad] of [[TW + 1.6, TD + 1.6, TR + .8, .05], [TW - 1.6, TD - 1.6, TR - .8, .05], [TW, TD, TR, .015]]) {
    const curve = new THREE.CatmullRomCurve3(loopPoints(w, d, r, 160).map(p => p.setY(TY + .03)), true);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 320, rad, 6, true), glow(rad > .02 ? BLUE : CYAN)));
  }
}
const lane = new THREE.CatmullRomCurve3(loopPoints(TW, TD, TR, 200).map(p => p.setY(TY + .02)), true);
// flowing light dashes along the lane
const DASHES = 46, dashes = new THREE.InstancedMesh(new THREE.BoxGeometry(.32, .02, .07), glow(CYAN), DASHES), dm = new THREE.Object3D();

function drawDashes(t) {
  for (let i = 0; i < DASHES; i++) {
    const u = ((i / DASHES - t * .012) % 1 + 1) % 1, p = lane.getPointAt(u), tg = lane.getTangentAt(u);
    dm.position.copy(p); dm.rotation.set(0, Math.atan2(-tg.z, tg.x), 0); dm.updateMatrix(); dashes.setMatrixAt(i, dm.matrix);
  }
  dashes.instanceMatrix.needsUpdate = true;
}
// where each stage sits on the lane (fractions along the loop, starting at the back-left straight)
const STAGE_U = [.77, .64, .41, .29];  // Idea (left corner), Backtest (front-left edge), Paper trading (front-right edge), Live (right corner): the flow runs backwards along the loop
function floorText(text, u, size = 1, col = "#4fb3ff") {
  const tex = canvasTex(1024, 200, (g, w, h) => {
    g.font = "700 120px Chakra Petch, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.shadowColor = col; g.shadowBlur = 30; g.fillStyle = col; g.fillText(text, w / 2, h / 2); g.shadowBlur = 0; g.fillStyle = "#e9f5ff"; g.globalAlpha = .55; g.fillText(text, w / 2, h / 2);
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(4.6 * size, .9 * size), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }));
  const p = lane.getPointAt(u), tg = lane.getTangentAt(u), out = new THREE.Vector3(tg.z, 0, -tg.x).normalize();
  if (out.dot(new THREE.Vector3(p.x - TCX, 0, p.z - TCZ)) < 0) out.negate();
  m.position.copy(p).addScaledVector(out, 1.55); m.position.y = .03;
  m.rotation.x = -Math.PI / 2; m.rotation.z = Math.atan2(-tg.z, tg.x); if (Math.cos(m.rotation.z) < 0) m.rotation.z += Math.PI;
  scene.add(m); return m;
}

{

const blocks = {};
const blockGeo = new THREE.BoxGeometry(.6, .6, .6), edgeGeo = new THREE.EdgesGeometry(blockGeo);
const STAGE_COL = { idea: 0x7a8db3, validating: 0x3aa0ff, building: 0x4fd2ff, awaiting_approval: GOLD, live: GREEN, scaling: GREEN };
function setOpps(opps) {
  const seen = new Set(), per = [0, 0, 0, 0];
  for (const o of opps || []) {
    const si = Math.max(0, STAGES.findIndex(s => s[1].includes(o.stage))); if (o.stage === "killed") continue;
    seen.add(o.id);
    let b = blocks[o.id];
    if (!b) {
      b = new THREE.Group();
      b.add(new THREE.Mesh(blockGeo, new THREE.MeshStandardMaterial({ color: 0x0a1a3a, transparent: true, opacity: .75, metalness: .3, roughness: .2, emissive: 0x000000 })));
      b.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: BLUE, toneMapped: false })));
      scene.add(b); blocks[o.id] = b;

    const col = STAGE_COL[o.stage] || BLUE;
    b.children[0].material.emissive.setHex(col).multiplyScalar(.35); b.children[1].material.color.setHex(col);
    b.userData.onClick = () => showCard(o.title || o.id, [["Fase", STAGE_IT[o.stage] || o.stage], ["Risultati", o.perf || "ancora nessun test"], ["Prossimo passo", o.next || "—"]]);
    const k = per[si]++, u = (STAGE_U[si] + (k - 1) * .022 + 1) % 1;
    b.userData.target = lane.getPointAt(u).clone().setY(TY + .33);
  }
  for (const id of Object.keys(blocks)) if (!seen.has(id)) { scene.remove(blocks[id]); delete blocks[id]; }
}

    const h = +p.hour + +p.minute / 60, wk = !["Sat", "Sun"].includes(p.weekday), isOpen = open && wk && h >= open[0] && h < open[1];

  });

const STAGE_COL_CSS = { idea: "#8ea3c8", validating: "#3aa0ff", building: "#4fd2ff", awaiting_approval: "#ffc35a", live: "#2fd59b", scaling: "#2fd59b" };
