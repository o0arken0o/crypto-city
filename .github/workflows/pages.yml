name: Publish site
# Publishes approved product pages from site/ to GitHub Pages.
# The read-only dashboard is published under /panel/ ONLY if repo variable PUBLISH_DASHBOARD == 'true'
# (warning: it exposes your revenue data to anyone with the URL).
on:
  push:
    branches: [main]
    paths: ["site/**", "dashboard/**", "state/state.json"]
  workflow_run:
    workflows: ["Crypto cycle", "Crypto commands"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Build
        run: |
          mkdir -p _site
          [ -d site ] && cp -r site/. _site/ || true
          [ -f _site/index.html ] || echo '<!doctype html><meta charset=utf-8><title>Prodotti</title><p>In arrivo.</p>' > _site/index.html
          if [ "${{ vars.PUBLISH_DASHBOARD }}" = "true" ]; then
            mkdir -p _site/panel && cp dashboard/index.html _site/panel/
            python3 engine/mm.py export _site/panel --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
