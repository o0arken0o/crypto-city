name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Python syntax
        run: python3 -m py_compile engine/ai.py engine/agent_runner.py
      - name: Unit tests
        run: python3 -m unittest discover tests -v
      - name: Orchestrator import smoke
        run: python3 -c 'import engine.ai as ai; print(len(ai.PROVIDERS), "providers")'
